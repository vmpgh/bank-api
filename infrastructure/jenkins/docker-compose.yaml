services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: jenkins

    user: root
    privileged: true

    restart: unless-stopped

    ports:
      - "8081:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      TZ: Europe/Sofia
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal

volumes:
  jenkins_home: