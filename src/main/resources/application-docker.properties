spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.bank.bankapi.kafka.event

bank.kafka.topics.transfer-completed=transfer-completed
bank.kafka.topics.transfer-completed-dlt=transfer-completed-dlt

management.opentelemetry.tracing.export.otlp.endpoint=http://otel-collector:4318/v1/traces
management.tracing.sampling.probability=1.0
management.otlp.metrics.export.enabled=false

spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
management.observations.annotations.enabled=true

spring.data.redis.host=redis
spring.data.redis.port=6379
spring.cache.type=redis